<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moshboard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Before the app's own styles load: the canvas color, so there's no white flash. */
      html,
      body {
        margin: 0;
        background: #0f1012;
      }

      /* The loader: a bright stretch of the Moshboard m's own stroke runs along the letter and
         back, over a faint m. Drawn with the same path as the mark, so it can't drift off it.
         It shows only on a real wait: it fades in after --mb-loader-delay, so a quick load never
         shows it. Lives here so it can show before any script runs; src/ui/Loader.tsx reuses it. */
      .mb-loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        opacity: 0;
        animation: mb-loader-in 260ms ease var(--mb-loader-delay, 300ms) forwards;
      }
      .mb-loader svg {
        width: 72px;
        height: 72px;
        overflow: visible;
      }
      /* Solid, not see-through: the two humps overlap where they meet, and a translucent stroke
         would show that spot twice as bright. (8% white over the page background.) */
      .mb-loader-base {
        stroke: #222325;
      }
      .mb-loader-run {
        stroke: #f7f8f8;
        /* One dash a fifth of the letter long (the path is 100 units); a gap twice the path keeps
           the next dash from peeking in at either end. */
        stroke-dasharray: 20 200;
        animation: mb-run 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
      }
      /* From the first foot to the last and back, always on the letter. The path goes down the
         middle line to its foot and back up, so the run covers every stroke of the m. */
      @keyframes mb-run {
        from {
          stroke-dashoffset: 0;
        }
        to {
          stroke-dashoffset: -80;
        }
      }
      @keyframes mb-loader-in {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mb-loader-run {
          display: none;
        }
        .mb-loader-base {
          stroke: #6f7072;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="mb-loader" role="status" aria-label="Loading">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <g transform="translate(0 -0.9)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <path class="mb-loader-base" d="M4.5 19.5V12a3.75 3.75 0 0 1 7.5 0v7.5" />
            <path class="mb-loader-base" d="M12 15.5V8a3.75 3.75 0 0 1 7.5 0V16" />
            <path class="mb-loader-run" pathLength="100" d="M4.5 19.5V12a3.75 3.75 0 0 1 7.5 0v7.5V8a3.75 3.75 0 0 1 7.5 0V16" />
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
